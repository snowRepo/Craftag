<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craftag</title>
    <script>
      // Apply theme before React loads to prevent flashing
      if (localStorage.getItem('craftag-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <style>
      /* Inject initial background color to prevent flash before CSS loads */
      body { background-color: #f5f5f7; margin: 0; }
      html[data-theme="dark"] body { background-color: #0d0f1a; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
