name: "Release Craftag"

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r craftag_py/requirements.txt

      - name: Import check
        run: python -c "from craftag_py.core.tag_io import read_tag; print('OK')"

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: |
          zip -r Craftag-${{ github.ref_name }}.zip craftag_py logo.png README.md run.sh \
            --exclude "*.pyc" --exclude "*/__pycache__/*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Craftag ${{ github.ref_name }}"
          body: "See the attached zip to run this version."
          draft: true
          files: Craftag-${{ github.ref_name }}.zip
