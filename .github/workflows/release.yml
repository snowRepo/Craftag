name: Build Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: AppleSilicon
          - os: macos-13
            arch: Intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r craftag_py/requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "logo.icns" --name "Craftag" craftag_py/main.py

      - name: Package macOS App (DMG)
        run: |
          mkdir dmg_content
          mv dist/Craftag.app dmg_content/
          ln -s /Applications dmg_content/Applications
          hdiutil create -volname "Craftag" -srcfolder dmg_content -ov -format UDZO "Craftag-macOS-${{ matrix.arch }}.dmg"

      - name: Upload macOS Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: Craftag-macOS-${{ matrix.arch }}.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r craftag_py/requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon "logo.ico" --name "Craftag" craftag_py/main.py

      - name: Upload Windows Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/Craftag.exe
