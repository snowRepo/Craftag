name: Build Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r craftag_py/requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS App (Universal & Optimized)
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "logo.icns" --target-architecture universal2 --exclude-module "PySide6.QtWebEngineCore" --exclude-module "PySide6.QtWebEngineWidgets" --exclude-module "PySide6.QtQml" --exclude-module "PySide6.QtQuick" --exclude-module "PySide6.QtNetwork" --add-data "license.txt:." --add-data "logo.png:." --name "Craftag" craftag_py/main.py

      - name: Package macOS App (DMG)
        run: |
          mkdir dmg_content
          mv dist/Craftag.app dmg_content/
          ln -s /Applications dmg_content/Applications
          hdiutil create -volname "Craftag" -srcfolder dmg_content -ov -format UDZO "Craftag-macOS.dmg"

      - name: Upload macOS Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: Craftag-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r craftag_py/requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows Executable (Optimized Directory)
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "logo.ico" --exclude-module "PySide6.QtWebEngineCore" --exclude-module "PySide6.QtWebEngineWidgets" --exclude-module "PySide6.QtQml" --exclude-module "PySide6.QtQuick" --exclude-module "PySide6.QtNetwork" --add-data "license.txt;." --add-data "logo.png;." --add-data "logo.ico;." --manifest "Craftag.exe.manifest" --name "Craftag" craftag_py/main.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload Windows Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/Craftag-Windows-Installer.exe
